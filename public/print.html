<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Impression — Atlas électoral du Val-d'Oise</title>
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <div class="pdf-status" id="pdfStatus">Préparation du PDF…</div>
  <div class="print-page" id="printPage">
    <header class="print-header">
      <img class="print-logo" src="prefet-val-doise-logo.png" alt="Préfet du Val-d'Oise">
      <div class="print-header-text">
        <h1 id="printTitle">Chargement…</h1>
        <p id="printSubtitle">Atlas électoral du Val-d'Oise</p>
      </div>
    </header>
    <div class="print-body">
      <div class="print-side" id="printSide"></div>
      <div class="print-table" id="printTable"></div>
    </div>
    <footer class="print-footer">
      <div class="print-sources" id="printSources"></div>
      <div class="print-reference">DDT du Val-d'Oise</div>
    </footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="print.js"></script>
</body>
</html>
