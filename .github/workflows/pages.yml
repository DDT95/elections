name: Publier l’Atlas électoral du Val-d’Oise sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:github
      - run: cp dist-github/index.html dist-github/404.html
      # print.html référence print.js/print.css par une URL fixe (fichiers publics non
      # fingerprintés par Vite, contrairement au reste du site) : sans cache-busting, un
      # navigateur ou le CDN de GitHub Pages peut continuer à servir une version périmée
      # après un déploiement, y compris pour de vrais correctifs déjà en ligne. Le SHA du
      # commit change à chaque déploiement, donc l'ajouter en query string force un
      # rechargement.
      - run: |
          sed -i "s/print.css\"/print.css?v=${GITHUB_SHA}\"/; s/print.js\"/print.js?v=${GITHUB_SHA}\"/" dist-github/print.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
